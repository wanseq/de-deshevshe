name: Publish site and refresh prices

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      store:
        description: 'all: all stores; fozzy: only Fozzy; check_fozzy: quick connection test'
        type: choice
        default: all
        options:
          - all
          - fozzy
          - check_fozzy
  schedule:
    - cron: '37 3 * * *'
      timezone: 'Europe/Kyiv'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-site-pages
  cancel-in-progress: false

jobs:
  check-fozzy:
    if: github.event_name == 'workflow_dispatch' && inputs.store == 'check_fozzy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r scraper/requirements.txt
      - name: Check Fozzy connection
        working-directory: scraper
        run: python -u fozzy_scraper.py --check
      - name: Save connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fozzy-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: scraper/fozzy_diagnostics.json
          retention-days: 14

  publish:
    if: inputs.store != 'check_fozzy'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r scraper/requirements.txt

      - name: Collect stores in parallel
        if: github.event_name != 'push'
        working-directory: scraper
        env:
          SELECTED_STORE: ${{ inputs.store || 'all' }}
        run: python -u refresh_catalogs.py --store "$SELECTED_STORE"

      - name: Save catalogues and logs for recovery
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            scraper/*_products.json
            scraper/catalog_meta.json
            scraper/*_refresh.log
            scraper/refresh_report.json
            scraper/fozzy_diagnostics.json

      - name: Persist verified catalogues
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scraper/atb_products.json scraper/silpo_products.json scraper/fozzy_products.json scraper/catalog_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified store catalogues"
            git push origin HEAD:main
          fi

      - name: Rebuild and validate products
        if: github.event_name != 'push'
        working-directory: scraper
        run: |
          python validate_build.py --raw
          cp ../products.js ../previous_products.js
          python -u merge.py
          python validate_build.py --merged

      - name: Persist current products
        if: github.event_name != 'push'
        run: |
          git add products.js
          if ! git diff --cached --quiet; then
            git commit -m "Update comparison prices"
            git push origin HEAD:main
          fi

      - name: Prepare static site and update asset version
        shell: bash
        run: |
          mkdir -p public
          cp index.html style.css app.js products.js public/
          touch public/.nojekyll
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          page = Path('public/index.html')
          fingerprint = sha256(Path('public/products.js').read_bytes()).hexdigest()[:12]
          page.write_text(page.read_text().replace('src="products.js"', f'src="products.js?v={fingerprint}"'))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
