name: Publish site and refresh prices

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
      timezone: 'Europe/Kyiv'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-site-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r scraper/requirements.txt

      - name: Collect stores in parallel
        if: github.event_name != 'push'
        working-directory: scraper
        run: python -u refresh_catalogs.py

      - name: Save catalogues and logs for recovery
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            scraper/*_products.json
            scraper/catalog_meta.json
            scraper/*_refresh.log
            scraper/refresh_report.json

      - name: Persist verified catalogues
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scraper/atb_products.json scraper/silpo_products.json scraper/fozzy_products.json scraper/catalog_meta.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified store catalogues"
            git push origin HEAD:main
          fi

      - name: Rebuild and validate products
        if: github.event_name != 'push'
        working-directory: scraper
        run: |
          python validate_build.py --raw
          cp ../products.js ../previous_products.js
          python -u merge.py
          python validate_build.py --merged

      - name: Persist current products
        if: github.event_name != 'push'
        run: |
          git add products.js
          if ! git diff --cached --quiet; then
            git commit -m "Update comparison prices"
            git push origin HEAD:main
          fi

      - name: Prepare static site and update asset version
        shell: bash
        run: |
          mkdir -p public
          cp index.html style.css app.js products.js public/
          touch public/.nojekyll
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          page = Path('public/index.html')
          fingerprint = sha256(Path('public/products.js').read_bytes()).hexdigest()[:12]
          page.write_text(page.read_text().replace('src="products.js"', f'src="products.js?v={fingerprint}"'))
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
